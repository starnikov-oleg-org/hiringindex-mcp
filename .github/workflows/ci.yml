name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # npm test = node test/smoke.js: работает на любой версии Node. Шаблон
      # "test/*.js" в node --test понимается только с Node 21, и CI падал на 18/20.
      - run: npm test
